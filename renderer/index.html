<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!-- KaTeX for rendering math/physics equations. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #20222e;           /* solid, cozy deep blue-grey */
    --line: rgba(255, 255, 255, 0.08);
    --text: #f1f1f4;
    --muted: #a4a4b0;
    --amber: #ffb347;        /* the "watching" light, a touch warmer */
    --amber-dim: #7a5418;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: transparent; overflow: hidden; }

  body {
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #shell {
    margin: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    overflow: hidden;
  }

  /* ---- brand strip ---- */
  #brand {
    -webkit-app-region: drag;
    padding: 12px 20px 4px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  #brand .name {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.4px;
    color: var(--text);
  }
  #brand .rower {
    height: 22px;
    width: auto;
    image-rendering: pixelated;   /* keep the pixel-art crisp */
    flex: none;
    align-self: center;           /* sit nicely against the baselined text */
    margin: -2px 2px 0;
  }
  #brand .tag {
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    margin-left: auto;            /* shove the tagline to the far right */
  }

  /* ---- now-playing chip ---- */
  #nowplaying {
    display: none;                /* shown only when something is playing/paused */
    align-self: center;
    align-items: center;
    gap: 4px;
    margin-left: 6px;
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
  }
  #nowplaying.live { display: inline-flex; }

  #nowplaying .track {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
    margin: 0 4px;
  }

  /* transport buttons */
  #nowplaying .np-btn {
    -webkit-app-region: no-drag;  /* let clicks reach the button */
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    line-height: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color .15s, background .15s;
  }
  #nowplaying .np-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  #nowplaying .np-btn:active { transform: scale(0.94); }
  #nowplaying .np-btn svg { width: 14px; height: 14px; fill: currentColor; }
  #nowplaying .np-toggle svg { width: 12px; height: 12px; }

  /* play/pause toggle holds both the EQ (playing) and the play triangle (paused) */
  #nowplaying .np-toggle .eq,
  #nowplaying .np-toggle .play-icon { display: none; }
  #nowplaying.playing .np-toggle .eq   { display: inline-flex; }
  #nowplaying.paused  .np-toggle .play-icon { display: inline-flex; }

  /* tiny animated equalizer bars, Spotify-ish green */
  #nowplaying .eq {
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    flex: none;
  }
  #nowplaying .eq span {
    display: block;
    width: 2px;
    background: #1db954;
    border-radius: 1px;
    animation: eq 1s ease-in-out infinite;
  }
  #nowplaying .eq span:nth-child(1) { animation-delay: 0s;    height: 8px;  }
  #nowplaying .eq span:nth-child(2) { animation-delay: 0.18s; height: 12px; }
  #nowplaying .eq span:nth-child(3) { animation-delay: 0.36s; height: 6px;  }
  @keyframes eq {
    0%, 100% { height: 3px;  }
    50%      { height: 12px; }
  }

  /* ---- input pill (drag handle + dot + input) ---- */
  #bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px;
    height: 64px;
    -webkit-app-region: drag;     /* whole bar drags the widget */
  }

  #dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--amber-dim);
    flex: none;
    transition: background .25s;
  }
  #dot.live {
    background: var(--amber);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,179,71,.45); }
    50%      { box-shadow: 0 0 0 8px rgba(255,179,71,0); }
  }

  #q {
    flex: 1;
    -webkit-app-region: no-drag;  /* but the input itself is typeable */
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    user-select: text;
  }
  #q::placeholder { color: var(--muted); }

  #close {
    -webkit-app-region: no-drag;
    background: none; border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 6px 8px;
    line-height: 1;
    border-radius: 8px;
  }
  #close:hover { color: var(--text); background: rgba(255,255,255,0.06); }

  /* ---- answer panel ---- */
  #panel {
    display: none;
    border-top: 1px solid var(--line);
    max-height: 540px;
    overflow-y: auto;
    padding: 18px 20px;
    user-select: text;
  }
  #panel.open { display: block; }

  .turn { margin-bottom: 16px; }
  .turn:last-child { margin-bottom: 4px; }

  .you {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 5px;
  }
  .ans { white-space: pre-wrap; font-size: 15px; }
  /* Display equations get a touch of breathing room. */
  .ans .katex-display { margin: 0.5em 0; overflow-x: auto; overflow-y: hidden; }

  .err { color: #ff9a9a; white-space: pre-wrap; }

  .thinking { color: var(--muted); font-style: italic; }

  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  #hint {
    padding: 0 20px 14px;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }
  #hint.open { display: block; }
</style>
</head>
<body>
  <div id="shell">
    <div id="brand">
      <span class="name">monet.</span>
      <img class="rower" src="monet-rower.png" alt="" />
      <div id="nowplaying">
        <button class="np-btn" data-cmd="previous track" title="Previous">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h2v10H4zM15 3v10L7 8z"/></svg>
        </button>
        <button class="np-btn np-toggle" data-cmd="playpause" title="Play / pause">
          <span class="eq"><span></span><span></span><span></span></span>
          <svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2l11 6-11 6z"/></svg>
        </button>
        <button class="np-btn" data-cmd="next track" title="Next">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3h2v10h-2zM1 3v10l8-5z"/></svg>
        </button>
        <span class="track"></span>
      </div>
      <span class="tag">life is an artwork</span>
    </div>
    <div id="bar">
      <div id="dot" title="Lights up while monet looks at your screen"></div>
      <input id="q" placeholder="Hey, what's on your mind?" autofocus />
      <button id="close" title="Hide (hotkey brings it back)">✕</button>
    </div>
    <div id="panel"></div>
    <div id="hint">Enter to chat · Esc to hide · drag the top to move me around</div>
  </div>

<script>
  const q = document.getElementById("q");
  const dot = document.getElementById("dot");
  const panel = document.getElementById("panel");
  const hint = document.getElementById("hint");
  const shell = document.getElementById("shell");

  // text-only history sent for context on follow-ups
  let history = [];
  let busy = false;

  // KaTeX auto-render config; same delimiters work for inline and display math.
  const MATH_DELIMS = [
    { left: "$$", right: "$$", display: true },
    { left: "\\[", right: "\\]", display: true },
    { left: "$",  right: "$",  display: false },
    { left: "\\(", right: "\\)", display: false },
  ];

  function renderMath(el) {
    if (typeof renderMathInElement !== "function") return; // script still loading
    try {
      renderMathInElement(el, {
        delimiters: MATH_DELIMS,
        throwOnError: false,
        ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      });
    } catch (_) { /* never let a bad equation break the UI */ }
  }

  function fitWindow() {
    // shell height + body margins
    window.glance.resize(shell.offsetHeight + 18);
  }

  function clearChat() {
    history = [];
    panel.innerHTML = "";
    panel.classList.remove("open");
    hint.classList.remove("open");
    fitWindow();
  }

  function addTurn(question) {
    const t = document.createElement("div");
    t.className = "turn";
    t.innerHTML = `<div class="you"></div><div class="ans thinking">let me take a look…</div>`;
    t.querySelector(".you").textContent = question;
    panel.appendChild(t);
    panel.classList.add("open");
    hint.classList.add("open");
    panel.scrollTop = panel.scrollHeight;
    fitWindow();
    return t.querySelector(".ans");
  }

  async function ask() {
    const question = q.value.trim();
    if (!question || busy) return;
    busy = true;
    q.value = "";
    dot.classList.add("live");
    const slot = addTurn(question);

    try {
      const answer = await window.glance.ask(question, history);
      slot.classList.remove("thinking");
      // textContent first (safe escape), then KaTeX walks the text nodes
      // and replaces $...$ / $$...$$ spans with rendered math.
      slot.textContent = answer;
      renderMath(slot);
      history.push({ role: "user", text: question });
      history.push({ role: "assistant", text: answer });
      if (history.length > 12) history = history.slice(-12); // keep it light
    } catch (err) {
      slot.classList.remove("thinking");
      slot.classList.add("err");
      slot.textContent = err.message || String(err);
    } finally {
      busy = false;
      dot.classList.remove("live");
      panel.scrollTop = panel.scrollHeight;
      fitWindow();
      q.focus();
    }
  }

  q.addEventListener("keydown", (e) => {
    if (e.key === "Enter") ask();
    if (e.key === "Escape") window.glance.hide();
  });

  document.getElementById("close").onclick = () => window.glance.hide();

  window.glance.onFocusInput(() => q.focus());

  // Now-playing chip — appears when Spotify or Apple Music has a track
  // loaded (playing or paused), disappears when stopped or quit.
  const npEl = document.getElementById("nowplaying");
  const npTrack = npEl.querySelector(".track");
  window.glance.onNowPlaying((info) => {
    if (info && info.track) {
      npTrack.textContent = info.artist
        ? `${info.track} — ${info.artist}`
        : info.track;
      npEl.classList.add("live");
      npEl.classList.toggle("playing", info.state === "playing");
      npEl.classList.toggle("paused",  info.state === "paused");
    } else {
      npEl.classList.remove("live", "playing", "paused");
      npTrack.textContent = "";
    }
  });
  npEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".np-btn");
    if (!btn) return;
    window.glance.mediaControl(btn.dataset.cmd);
  });

  // Wipe the chat if the widget stays hidden for 30s+, so it never
  // comes back full of stale turns.
  const HIDE_CLEAR_MS = 30_000;
  let hideTimer = null;
  window.glance.onHidden(() => {
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(clearChat, HIDE_CLEAR_MS);
  });
  window.glance.onShown(() => {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  });

  fitWindow();
</script>
</body>
</html>
